<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — FotoVault</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></head><body>
<header class="nav glass"><div class="row"><div class="brand">Foto<span class="gold">Vault</span></div><div class="row"><a class="btn btn-light" href="profile.html">Profile</a><button class="btn btn-dark" onclick="FV.signOut()">Keluar</button></div></div></header>
<main class="wrap" style="padding:30px 0 80px"><div class="row"><div><span class="pill">Private space</span><h1 class="serif">Dashboard</h1><p class="muted">Koleksi foto kamu, tersusun rapi.</p></div><button class="btn btn-dark" id="uploadBtn">Upload foto</button><input id="file" type="file" accept="image/*" multiple hidden></div>
<div class="grid" style="margin:20px 0"><div class="stat glass"><span class="muted">Foto</span><strong id="count">0</strong></div><div class="stat glass"><span class="muted">Storage</span><strong id="used">0 B</strong></div><div class="stat glass"><span class="muted">Quota</span><strong>1 GB</strong></div><div class="stat glass"><span class="muted">Status</span><strong class="gold">Private</strong></div></div>
<section class="maincard glass"><div class="row"><h2 class="serif">Galeri</h2><button class="btn btn-light" onclick="load()">Refresh</button></div><div id="gallery" class="photo-grid" style="margin-top:18px"></div></section></main>
<div id="toast" class="toast hidden"></div>
<script>
let session,user;
function toast(x){const t=document.getElementById("toast");t.textContent=x;t.classList.remove("hidden");setTimeout(()=>t.classList.add("hidden"),2500)}
async function load(){const r=await FV.db.from("photos").select("*").order("created_at",{ascending:false});if(r.error){toast(r.error.message);return}document.getElementById("count").textContent=r.data.length;document.getElementById("used").textContent=FV.bytes(r.data.reduce((a,x)=>a+Number(x.size||0),0));const g=document.getElementById("gallery");g.innerHTML="";for(const p of r.data){const s=await FV.db.storage.from("photos").createSignedUrl(p.path,300);const d=document.createElement("div");d.className="photo";d.innerHTML=s.data?.signedUrl?`<img src="${s.data.signedUrl}" alt="">`:`<div style="padding:20px">${FV.escapeHtml(p.name)}</div>`;g.appendChild(d)}}
document.getElementById("uploadBtn").onclick=()=>document.getElementById("file").click();
document.getElementById("file").onchange=async e=>{for(const f of e.target.files){const path=`${user.id}/${crypto.randomUUID()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,"_")}`;const up=await FV.db.storage.from("photos").upload(path,f,{contentType:f.type,upsert:false});if(up.error){toast(up.error.message);continue}const ins=await FV.db.from("photos").insert({user_id:user.id,name:f.name,path,size:f.size,mime_type:f.type});if(ins.error)toast(ins.error.message)}toast("Upload selesai");load()};
(async()=>{session=await FV.requireSession();user=session.user;load()})();
</script></body></html>
