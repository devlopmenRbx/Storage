<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>FotoVault — My Vault</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

<style>

/* =========================================================
   PREMIUM VAULT
========================================================= */

:root{
    --gold:#c59a4d;
    --gold2:#9d7737;
    --ink:#181715;
    --muted:#77716a;
    --cream:#f8f5ee;
    --line:rgba(30,25,18,.08);
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    color:var(--ink);
    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(220,194,137,.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 20%,
            rgba(255,255,255,.95),
            transparent 30%
        ),
        #f7f4ed;
    min-height:100vh;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

.vault-shell{
    width:min(1380px,94%);
    margin:auto;
}

/* =========================================================
   HEADER
========================================================= */

.vault-header{
    position:sticky;
    top:12px;
    z-index:50;
    margin:14px auto 0;
}

.vault-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:12px 15px;
    border:1px solid rgba(255,255,255,.75);
    background:rgba(255,255,255,.62);
    backdrop-filter:blur(25px) saturate(140%);
    -webkit-backdrop-filter:blur(25px) saturate(140%);
    border-radius:24px;
    box-shadow:
        0 18px 60px rgba(54,43,23,.08),
        inset 0 1px rgba(255,255,255,.9);
}

.brand{
    font-family:Georgia,serif;
    font-size:21px;
    font-weight:700;
    text-decoration:none;
    color:var(--ink);
}

.brand span{
    color:var(--gold);
}

.nav-right{
    display:flex;
    align-items:center;
    gap:8px;
}

.icon-btn{
    width:42px;
    height:42px;
    border:1px solid var(--line);
    border-radius:15px;
    background:rgba(255,255,255,.7);
    display:grid;
    place-items:center;
    color:#555;
    transition:
        transform .25s ease,
        background .25s ease,
        border-color .25s ease;
}

.icon-btn:hover{
    transform:translateY(-2px);
    background:#fff;
    border-color:rgba(197,154,77,.45);
}

.profile-btn{
    display:flex;
    align-items:center;
    gap:8px;
    padding:4px 10px 4px 4px;
    border:1px solid var(--line);
    border-radius:999px;
    background:rgba(255,255,255,.75);
}

.profile-avatar{
    width:34px;
    height:34px;
    border-radius:50%;
    object-fit:cover;
    background:#efe4cc;
}

.profile-name{
    max-width:110px;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    font-size:12px;
    font-weight:700;
}

/* =========================================================
   HERO
========================================================= */

.hero{
    position:relative;
    overflow:hidden;
    margin-top:28px;
    padding:35px;
    border-radius:34px;
    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.78),
            rgba(248,238,216,.58)
        );
    border:1px solid rgba(255,255,255,.8);
    box-shadow:0 30px 80px rgba(50,40,22,.08);
}

.hero:after{
    content:"";
    position:absolute;
    width:280px;
    height:280px;
    right:-100px;
    top:-130px;
    border-radius:50%;
    background:rgba(210,175,103,.16);
    filter:blur(5px);
    animation:heroFloat 7s ease-in-out infinite;
}

@keyframes heroFloat{
    0%,100%{transform:translate(0,0)}
    50%{transform:translate(-20px,25px)}
}

.hero-label{
    color:var(--gold2);
    font-size:10px;
    font-weight:800;
    letter-spacing:.16em;
}

.hero h1{
    position:relative;
    z-index:2;
    margin:8px 0;
    font-family:Georgia,serif;
    font-size:clamp(32px,5vw,58px);
    line-height:1;
    letter-spacing:-.04em;
}

.hero p{
    position:relative;
    z-index:2;
    max-width:650px;
    color:var(--muted);
    line-height:1.7;
}

/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    margin:25px 0 17px;
}

.toolbar-left,
.toolbar-right{
    display:flex;
    align-items:center;
    gap:8px;
}

.gold-btn,
.soft-btn{
    min-height:40px;
    border-radius:14px;
    padding:0 15px;
    border:1px solid var(--line);
    transition:.25s ease;
}

.gold-btn{
    color:#fff;
    border:0;
    background:
        linear-gradient(
            135deg,
            var(--gold),
            var(--gold2)
        );
    box-shadow:
        0 10px 28px rgba(173,129,54,.22);
}

.gold-btn:hover,
.soft-btn:hover{
    transform:translateY(-2px);
}

.soft-btn{
    background:rgba(255,255,255,.72);
}

.search{
    width:min(300px,45vw);
    height:40px;
    border-radius:14px;
    border:1px solid var(--line);
    outline:none;
    padding:0 13px;
    background:rgba(255,255,255,.7);
}

.search:focus{
    border-color:rgba(197,154,77,.6);
    box-shadow:0 0 0 4px rgba(197,154,77,.09);
}

/* =========================================================
   PHOTO GRID
========================================================= */

.photo-grid{
    display:grid;
    grid-template-columns:
        repeat(
            auto-fill,
            minmax(180px,1fr)
        );
    gap:14px;
}

.photo-card{
    position:relative;
    overflow:hidden;
    aspect-ratio:1;
    border-radius:22px;
    background:#e9e3d7;
    border:1px solid rgba(255,255,255,.85);
    box-shadow:0 15px 40px rgba(50,40,22,.08);
    opacity:0;
    transform:translateY(18px) scale(.985);
    animation:
        cardIn .65s
        cubic-bezier(.16,1,.3,1)
        forwards;
}

@keyframes cardIn{
    to{
        opacity:1;
        transform:none;
    }
}

.photo-card img{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    opacity:0;
    transform:scale(1.04);
    transition:
        opacity .55s ease,
        transform .8s cubic-bezier(.16,1,.3,1);
}

.photo-card img.loaded{
    opacity:1;
    transform:scale(1);
}

.photo-skeleton{
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            105deg,
            #ebe5d9 20%,
            #f7f3eb 35%,
            #ebe5d9 50%
        );
    background-size:220% 100%;
    animation:shimmer 1.5s infinite;
}

@keyframes shimmer{
    to{
        background-position:-220% 0;
    }
}

.photo-card.loaded .photo-skeleton{
    opacity:0;
    pointer-events:none;
}

.photo-overlay{
    position:absolute;
    left:9px;
    right:9px;
    bottom:9px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:8px 9px;
    border-radius:14px;
    color:white;
    background:rgba(20,18,14,.42);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
}

.photo-title{
    min-width:0;
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
    font-size:11px;
    font-weight:700;
}

.photo-actions{
    display:flex;
    gap:5px;
}

.mini-btn{
    width:30px;
    height:30px;
    border:0;
    border-radius:10px;
    color:white;
    background:rgba(255,255,255,.17);
    backdrop-filter:blur(8px);
}

.mini-btn:hover{
    background:rgba(255,255,255,.3);
}

/* =========================================================
   EMPTY / LOADING
========================================================= */

.loading-state{
    min-height:250px;
    display:grid;
    place-items:center;
    color:var(--muted);
}

.loader-ring{
    width:42px;
    height:42px;
    border:3px solid rgba(197,154,77,.18);
    border-top-color:var(--gold);
    border-radius:50%;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

.empty{
    padding:65px 20px;
    text-align:center;
    color:var(--muted);
}

/* =========================================================
   MODAL
========================================================= */

.modal{
    position:fixed;
    inset:0;
    z-index:100;
    display:none;
    place-items:center;
    padding:20px;
    background:rgba(19,17,14,.57);
    backdrop-filter:blur(16px);
}

.modal.open{
    display:grid;
    animation:fadeIn .25s ease;
}

@keyframes fadeIn{
    from{opacity:0}
    to{opacity:1}
}

.modal-card{
    width:min(460px,100%);
    padding:22px;
    border-radius:28px;
    background:rgba(255,255,255,.9);
    border:1px solid rgba(255,255,255,.9);
    box-shadow:0 40px 100px rgba(0,0,0,.25);
    animation:modalIn .45s cubic-bezier(.16,1,.3,1);
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:translateY(25px) scale(.96);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.modal-title{
    font-family:Georgia,serif;
    font-size:25px;
    margin:0;
}

.modal-input{
    width:100%;
    height:46px;
    margin-top:16px;
    border-radius:15px;
    border:1px solid var(--line);
    outline:none;
    padding:0 14px;
    background:#fff;
}

.modal-input:focus{
    border-color:var(--gold);
}

.modal-actions{
    display:flex;
    gap:8px;
    margin-top:14px;
}

/* =========================================================
   SHARE SCANNING
========================================================= */

.share-scan{
    display:none;
    text-align:center;
    padding:25px 5px 10px;
}

.share-scan.active{
    display:block;
}

.scan-orb{
    position:relative;
    width:110px;
    height:110px;
    margin:auto;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:
        radial-gradient(
            circle,
            #fff,
            #f1e3c6
        );
    box-shadow:
        0 0 0 1px #e1c78f,
        0 0 0 12px rgba(197,154,77,.08),
        0 0 60px rgba(197,154,77,.25);
}

.scan-orb:before,
.scan-orb:after{
    content:"";
    position:absolute;
    inset:-15px;
    border-radius:50%;
    border:1px solid rgba(197,154,77,.4);
    animation:scanPulse 1.8s ease-out infinite;
}

.scan-orb:after{
    animation-delay:.9s;
}

@keyframes scanPulse{
    0%{
        opacity:0;
        transform:scale(.75);
    }
    30%{
        opacity:1;
    }
    100%{
        opacity:0;
        transform:scale(1.35);
    }
}

.scan-line{
    position:absolute;
    left:17px;
    right:17px;
    height:2px;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
    box-shadow:0 0 12px var(--gold);
    animation:scanLine 1.45s ease-in-out infinite;
}

@keyframes scanLine{
    0%,100%{top:25px}
    50%{top:83px}
}

.scan-status{
    margin-top:25px;
    font-size:13px;
    color:var(--muted);
}

.scan-progress{
    height:5px;
    margin-top:14px;
    overflow:hidden;
    border-radius:999px;
    background:#eee8dc;
}

.scan-progress span{
    display:block;
    width:0%;
    height:100%;
    border-radius:999px;
    background:linear-gradient(90deg,var(--gold2),var(--gold));
    transition:width .25s ease;
}

/* =========================================================
   NOTIFICATION
========================================================= */

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:200;
    max-width:320px;
    padding:14px 16px;
    border-radius:17px;
    color:white;
    background:rgba(25,23,20,.9);
    backdrop-filter:blur(18px);
    box-shadow:0 20px 50px rgba(0,0,0,.2);
    transform:translateY(20px);
    opacity:0;
    pointer-events:none;
    transition:.35s ease;
}

.toast.show{
    transform:none;
    opacity:1;
}

@media(max-width:700px){

    .vault-shell{
        width:92%;
    }

    .hero{
        padding:25px;
        border-radius:27px;
    }

    .toolbar{
        align-items:stretch;
        flex-direction:column;
    }

    .toolbar-left,
    .toolbar-right{
        width:100%;
    }

    .search{
        width:100%;
    }

    .photo-grid{
        grid-template-columns:
            repeat(
                2,
                minmax(0,1fr)
            );
        gap:9px;
    }

    .profile-name{
        display:none;
    }

}

</style>
</head>

<body>

<header class="vault-header vault-shell">

<!-- =======================================================
     SHARE MODAL
======================================================= -->

<div
    class="modal"
    id="shareModal"
>

    <div class="modal-card">

        <div class="modal-head">

            <div>
                <p
                    style="

<script>

/* =========================================================
   CONFIG
========================================================= */

const db = FV.db;

const BUCKET = "photos";

/*
 * Nama Edge Function:
 *
 * admin-api
 *
 * Pastikan Edge Function kamu dideploy dengan
 * nama yang sama.
 */

const SHARE_FUNCTION = "admin-api";


/* =========================================================
   STATE
========================================================= */

let currentUser = null;
let currentPhotos = [];
let selectedPhoto = null;


/* =========================================================
   HELPERS
========================================================= */

const $ = id =>
    document.getElementById(id);


function toast(message){

    const el = $("toast");

    el.textContent = message;

    el.classList.add("show");

    clearTimeout(
        toast.timer
    );

    toast.timer =
        setTimeout(
            () => {
                el.classList.remove("show");
            },
            3200
        );
}


function escapeHTML(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function formatSize(bytes){

    if(!bytes)
        return "0 KB";

    const units=[
        "B",
        "KB",
        "MB",
        "GB"
    ];

    let i=0;
    let n=Number(bytes);

    while(
        n >= 1024 &&
        i < units.length-1
    ){
        n/=1024;
        i++;
    }

    return n.toFixed(
        n >= 10 ? 0 : 1
    )+" "+units[i];
}


/* =========================================================
   SESSION
========================================================= */

async function requireUser(){

    const {
        data,
        error
    } =
        await db.auth.getUser();

    if(
        error ||
        !data ||
        !data.user
    ){

        location.href =
            "login.html";

        return false;
    }

    currentUser =
        data.user;

    return true;
}


/* =========================================================
   PROFILE
========================================================= */

function renderProfile(){

    if(!currentUser)
        return;

    const name =
        currentUser.user_metadata?.display_name ||
        currentUser.user_metadata?.full_name ||
        currentUser.email?.split("@")[0] ||
        "User";

    $("profileName")
        .textContent =
        name;

    const avatar =
        currentUser.user_metadata?.avatar_url;

    if(avatar){

        $("profileAvatar")
            .src =
            avatar;

    }else{

        /*
         * SVG data avatar lokal.
         * Tidak membutuhkan external avatar service.
         */

        const letter =
            encodeURIComponent(
                name
                    .charAt(0)
                    .toUpperCase()
            );

        $("profileAvatar")
            .src =
            `data:image/svg+xml;charset=UTF-8,
            <svg xmlns="http://www.w3.org/2000/svg"
            width="80" height="80">
            <rect width="100%" height="100%"
            rx="40" fill="%23f0e4cc"/>
            <text x="50%" y="55%"
            dominant-baseline="middle"
            text-anchor="middle"
            font-size="32"
            fill="%239d7737">${letter}</text>
            </svg>`;
    }
}


/* =========================================================
   LOAD PHOTOS
========================================================= */

async function loadPhotos(){

    $("gallery").innerHTML = `
        <div class="loading-state">
            <div>
                <div class="loader-ring"></div>
                <p>Memuat foto dengan aman...</p>
            </div>
        </div>
    `;


    /*
     * RLS memastikan query ini hanya mengembalikan:
     *
     * 1. foto milik current_user
     * 2. foto yang secara eksplisit dibagikan kepada current_user
     *
     * Tidak ada filter user_id yang dipercaya dari browser.
     */

    const {
        data,
        error
    } =
        await db
            .from("photos")
            .select(`
                id,
                user_id,
                filename,
                path,
                size,
                created_at
            `)
            .order(
                "created_at",
                {
                    ascending:false
                }
            );


    if(error){

        console.error(
            error
        );

        $("gallery").innerHTML = `
            <div class="empty">
                Gagal memuat foto.
            </div>
        `;

        return;
    }


    currentPhotos =
        data || [];


    if(!currentPhotos.length){

        $("gallery").innerHTML = `
            <div class="empty">
                <h3 style="font-family:Georgia,serif">
                    Vault masih kosong
                </h3>
                <p>
                    Upload foto pertama kamu.
                </p>
            </div>
        `;

        return;
    }


    /*
     * Buat card dahulu.
     *
     * Signed URL dibuat secara PARALEL,
     * bukan satu-per-satu dalam loop.
     */

    const cards =
        currentPhotos.map(
            (photo,index) => {

                return `
                    <article
                        class="photo-card"
                        data-id="${escapeHTML(photo.id)}"
                        data-name="${escapeHTML(photo.filename || "")}"
                        style="animation-delay:${Math.min(index,15)*45}ms"
                    >

                        <div class="photo-skeleton"></div>

                        <img
                            data-photo-image
                            alt="${escapeHTML(photo.filename || "Photo")}"
                            decoding="async"
                            loading="lazy"
                        >

                        <div class="photo-overlay">

                            <span class="photo-title">
                                ${escapeHTML(
                                    photo.filename ||
                                    "Photo"
                                )}
                            </span>

                            <div class="photo-actions">

                                <button
                                    class="mini-btn share-photo"
                                    data-id="${escapeHTML(photo.id)}"
                                    title="Bagikan"
                                >
                                    ↗
                                </button>

                            </div>

                        </div>

                    </article>
                `;
            }
        ).join("");


    $("gallery").innerHTML =
        `<div class="photo-grid">${cards}</div>`;


    /*
     * Ambil signed URL paralel.
     */

    const results =
        await Promise.allSettled(
            currentPhotos.map(
                photo =>
                    db.storage
                        .from(BUCKET)
                        .createSignedUrl(
                            photo.path,
                            600
                        )
            )
        );


    results.forEach(
        (result,index) => {

            const photo =
                currentPhotos[index];

            const card =
                document.querySelector(
                    `.photo-card[data-id="${CSS.escape(photo.id)}"]`
                );

            if(!card)
                return;

            const image =
                card.querySelector(
                    "[data-photo-image]"
                );


            if(
                result.status ===
                "fulfilled" &&
                result.value?.data?.signedUrl
            ){

                image.src =
                    result.value.data.signedUrl;

                image.onload =
                    () => {

                        image.classList.add(
                            "loaded"
                        );

                        card.classList.add(
                            "loaded"
                        );

                    };

                image.onerror =
                    () => {

                        card.classList.add(
                            "loaded"
                        );

                    };

            }else{

                card.classList.add(
                    "loaded"
                );

            }

        }
    );


    document
        .querySelectorAll(
            ".share-photo"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();

                        const id =
                            button.dataset.id;

                        const photo =
                            currentPhotos.find(
                                p =>
                                    String(p.id) ===
                                    String(id)
                            );

                        if(photo)
                            openShare(photo);

                    }
                );

            }
        );
}


/* =========================================================
   SEARCH
========================================================= */

$("searchInput")
    .addEventListener(
        "input",
        event => {

            const query =
                event.target.value
                    .toLowerCase()
                    .trim();

            document
                .querySelectorAll(
                    ".photo-card"
                )
                .forEach(
                    card => {

                        const name =
                            (
                                card.dataset.name ||
                                ""
                            )
                            .toLowerCase();

                        card.style.display =
                            (
                                !query ||
                                name.includes(query)
                            )
                            ? ""
                            : "none";

                    }
                );

        }
    );


/* =========================================================
   UPLOAD
========================================================= */

$("uploadBtn")
    .addEventListener(
        "click",
        () =>
            $("fileInput").click()
    );


$("fileInput")
    .addEventListener(
        "change",
        async event => {

            const files =
                [...event.target.files];

            if(!files.length)
                return;


            $("uploadBtn")
                .disabled = true;

            $("uploadBtn")
                .textContent =
                "Mengupload...";


            try{

                for(
                    const file of files
                ){

                    if(
                        !file.type.startsWith(
                            "image/"
                        )
                    )
                        continue;


                    /*
                     * Storage path wajib dimulai
                     * dengan UID user sendiri.
                     */

                    const extension =
                        (
                            file.name
                                .split(".")
                                .pop() ||
                            "jpg"
                        )
                        .toLowerCase()
                        .replace(
                            /[^a-z0-9]/g,
                            ""
                        );

                    const filename =
                        `${crypto.randomUUID()}.${extension}`;

                    const path =
                        `${currentUser.id}/${filename}`;


                    const {
                        error:
                        uploadError
                    } =
                        await db.storage
                            .from(BUCKET)
                            .upload(
                                path,
                                file,
                                {
                                    upsert:false,
                                    contentType:
                                        file.type
                                }
                            );


                    if(uploadError)
                        throw uploadError;


                    /*
                     * Simpan metadata.
                     */

                    const {
                        error:
                        insertError
                    } =
                        await db
                            .from("photos")
                            .insert({
                                user_id:
                                    currentUser.id,

                                filename:
                                    file.name,

                                path:
                                    path,

                                size:
                                    file.size
                            });


                    if(insertError)
                        throw insertError;

                }


                toast(
                    "Foto berhasil ditambahkan."
                );

                await loadPhotos();

            }catch(error){

                console.error(
                    error
                );

                toast(
                    error.message ||
                    "Upload gagal."
                );

            }finally{

                $("uploadBtn")
                    .disabled = false;

                $("uploadBtn")
                    .textContent =
                    "Upload Foto";

                $("fileInput")
                    .value = "";

            }

        }
    );


/* =========================================================
   SHARE MODAL
========================================================= */

function openShare(photo){

    selectedPhoto =
        photo;

    $("shareFilename")
        .textContent =
        photo.filename ||
        "Foto";

    $("recipientEmail")
        .value = "";

    $("shareForm")
        .style.display =
        "block";

    $("shareScan")
        .classList.remove(
            "active"
        );

    $("shareModal")
        .classList.add(
            "open"
        );

    setTimeout(
        () =>
            $("recipientEmail")
                .focus(),
        250
    );
}


function closeShare(){

    selectedPhoto =
        null;

    $("shareModal")
        .classList.remove(
            "open"
        );

    $("shareScan")
        .classList.remove(
            "active"
        );

    $("shareForm")
        .style.display =
        "block";

    $("scanProgress")
        .style.width =
        "0%";
}


$("closeShare")
    .onclick =
    closeShare;

$("cancelShare")
    .onclick =
    closeShare;


$("shareModal")
    .addEventListener(
        "click",
        event => {

            if(
                event.target ===
                $("shareModal")
            ){
                closeShare();
            }

        }
    );


/* =========================================================
   SHARE SCAN UI
========================================================= */

function startScan(){

    $("shareForm")
        .style.display =
        "none";

    $("shareScan")
        .classList.add(
            "active"
        );

    $("scanProgress")
        .style.width =
        "8%";

    $("scanStatus")
        .textContent =
        "Menghubungkan ke server aman...";

    setTimeout(
        () => {
            $("scanProgress")
                .style.width =
                "32%";

            $("scanStatus")
                .textContent =
                "Memverifikasi penerima...";
        },
        350
    );

    setTimeout(
        () => {
            $("scanProgress")
                .style.width =
                "58%";

            $("scanStatus")
                .textContent =
                "Memeriksa hak akses foto...";
        },
        800
    );

    setTimeout(
        () => {
            $("scanProgress")
                .style.width =
                "78%";

            $("scanStatus")
                .textContent =
                "Menyiapkan akses berbagi...";
        },
        1250
    );

}


/* =========================================================
   SEND SHARE
========================================================= */

$("sendShare")
    .addEventListener(
        "click",
        async () => {

            if(!selectedPhoto)
                return;


            const email =
                $("recipientEmail")
                    .value
                    .trim()
                    .toLowerCase();


            if(!email){

                toast(
                    "Masukkan email penerima."
                );

                return;
            }


            if(
                !email.includes("@")
            ){

                toast(
                    "Email penerima tidak valid."
                );

                return;
            }


            startScan();


            try{

                /*
                 * PENTING:
                 *
                 * Tidak mencari auth.users
                 * dari browser.
                 *
                 * Edge Function yang melakukan:
                 *
                 * 1. validasi JWT
                 * 2. validasi pemilik foto
                 * 3. mencari penerima
                 * 4. membuat photo_share
                 * 5. membuat notification
                 */

                const {
                    data:
                    sessionData
                } =
                    await db.auth
                        .getSession();


                const token =
                    sessionData
                        ?.session
                        ?.access_token;


                if(!token)
                    throw new Error(
                        "Session login sudah berakhir."
                    );


                const {
                    data,
                    error
                } =
                    await db.functions
                        .invoke(
                            SHARE_FUNCTION,
                            {
                                body:{
                                    action:
                                        "share_photo",

                                    photo_id:
                                        selectedPhoto.id,

                                    recipient_email:
                                        email
                                }
                            }
                        );


                if(error)
                    throw error;


                if(
                    !data ||
                    data.success !== true
                ){

                    throw new Error(
                        data?.message ||
                        "Foto gagal dibagikan."
                    );

                }


                $("scanProgress")
                    .style.width =
                    "100%";

                $("scanStatus")
                    .textContent =
                    "Foto berhasil dibagikan.";


                setTimeout(
                    () => {

                        closeShare();

                        toast(
                            "Foto berhasil dibagikan dan notifikasi telah dikirim."
                        );

                    },
                    600
                );


            }catch(error){

                console.error(
                    "SHARE ERROR:",
                    error
                );

                closeShare();

                toast(
                    error.message ||
                    "Gagal membagikan foto."
                );

            }

        }
    );


/* =========================================================
   NOTIFICATIONS
========================================================= */

$("notificationBtn")
    .addEventListener(
        "click",
        async () => {

            const {
                data,
                error
            } =
                await db
                    .from("notifications")
                    .select(
                        "id,title,message,read,created_at"
                    )
                    .eq(
                        "user_id",
                        currentUser.id
                    )
                    .order(
                        "created_at",
                        {
                            ascending:false
                        }
                    )
                    .limit(20);


            if(error){

                toast(
                    "Notifikasi tidak dapat dimuat."
                );

                return;
            }


            if(!data?.length){

                toast(
                    "Belum ada notifikasi."
                );

                return;
            }


            const unread =
                data.filter(
                    x => !x.read
                );


            toast(
                unread.length
                    ? `${unread.length} notifikasi baru.`
                    : `Ada ${data.length} notifikasi.`
            );


            /*
             * Tandai sebagai dibaca.
             */

            if(unread.length){

                await db
                    .from("notifications")
                    .update({
                        read:true
                    })
                    .eq(
                        "user_id",
                        currentUser.id
                    )
                    .eq(
                        "read",
                        false
                    );

            }

        }
    );


/* =========================================================
   PROFILE
========================================================= */

$("profileBtn")
    .addEventListener(
        "click",
        () => {
            location.href =
                "profile.html";
        }
    );


/* =========================================================
   REFRESH
========================================================= */

$("refreshBtn")
    .addEventListener(
        "click",
        async () => {

            const button =
                $("refreshBtn");

            button.style.transform =
                "rotate(360deg)";

            await loadPhotos();

            setTimeout(
                () => {
                    button.style.transform =
                        "";
                },
                500
            );

        }
    );


/* =========================================================
   AUTH STATE
========================================================= */

db.auth.onAuthStateChange(
    (event) => {

        if(
            event ===
            "SIGNED_OUT"
        ){

            location.href =
                "login.html";

        }

    }
);


/* =========================================================
   INIT
========================================================= */

(async function(){

    const ok =
        await requireUser();

    if(!ok)
        return;

    renderProfile();

    await loadPhotos();

})();

</script>
