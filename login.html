<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masuk — FotoVault</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></head>
<body><div class="auth"><div class="authbox glass"><a href="index.html" class="brand">Foto<span class="gold">Vault</span></a><span class="pill" id="badge">PRIVATE PHOTO VAULT</span><h1 class="serif" id="title">Selamat datang kembali</h1><p class="muted" id="sub">Masuk ke brankas foto pribadi kamu.</p><div class="stack"><input id="email" class="input" type="email" autocomplete="email" placeholder="nama@email.com"><input id="password" class="input" type="password" autocomplete="current-password" placeholder="Password"><button id="submit" class="btn btn-dark" type="button">Masuk</button><button id="toggle" class="btn btn-light" type="button">Buat akun</button><a href="index.html" style="text-align:center;color:#888;font-size:13px">Kembali</a></div><p id="msg" class="muted"></p></div></div>
<script>
let register=new URLSearchParams(location.search).get('mode')==='register';
const $=id=>document.getElementById(id),email=$('email'),password=$('password'),submit=$('submit'),toggle=$('toggle'),msg=$('msg');
function render(){ $('badge').textContent=register?'CREATE YOUR VAULT':'PRIVATE PHOTO VAULT'; $('title').textContent=register?'Buat Vault baru':'Selamat datang kembali'; $('sub').textContent=register?'Daftarkan akun untuk menyimpan foto secara private.':'Masuk ke brankas foto pribadi kamu.'; submit.textContent=register?'Daftar':'Masuk'; toggle.textContent=register?'Saya sudah punya akun':'Buat akun'; password.autocomplete=register?'new-password':'current-password'; }
function say(t,err=false){msg.textContent=t;msg.style.color=err?'#b42318':'#777';}
toggle.onclick=()=>{register=!register;render();say('')};
async function route(user){
  const {data,error}=await FV.db.from('user_roles').select('role').eq('user_id',user.id).maybeSingle();
  console.log('ROLE CHECK', {uid:user.id, data, error});
  if(error){say('Role belum bisa diperiksa: '+error.message,true);return;}
  const role=String(data?.role||'user').trim().toLowerCase();
  if(role==='admin'){say('Admin terverifikasi. Kembali ke halaman utama...');setTimeout(()=>location.replace('index.html'),250);}
  else {say('Login berhasil. Kembali ke halaman utama...');setTimeout(()=>location.replace('index.html'),250);}
}
submit.onclick=async()=>{
  const e=email.value.trim(),p=password.value;if(!e||p.length<6)return say('Masukkan email dan password minimal 6 karakter.',true);
  submit.disabled=true;toggle.disabled=true;say(register?'Membuat akun...':'Memverifikasi akun...');
  try{const r=register?await FV.db.auth.signUp({email:e,password:p}):await FV.db.auth.signInWithPassword({email:e,password:p});if(r.error)throw r.error;if(register&&!r.data.session){say('Akun dibuat. Cek email konfirmasi jika diminta.');return}await route(r.data.user)}catch(err){console.error(err);say(err.message||'Terjadi kesalahan.',true)}finally{submit.disabled=false;toggle.disabled=false}
};
[email,password].forEach(x=>x.addEventListener('keydown',e=>{if(e.key==='Enter')submit.click()}));render();
</script></body></html>
