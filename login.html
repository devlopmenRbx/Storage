<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masuk — FotoVault</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></head><body>
<div class="auth"><div class="authbox glass"><a href="index.html" class="brand">Foto<span class="gold">Vault</span></a><h1 class="serif" id="title">Selamat datang kembali</h1><p class="muted" id="sub">Masuk ke brankas foto pribadi kamu.</p><div class="stack">
<input id="email" class="input" type="email" placeholder="Email">
<input id="password" class="input" type="password" placeholder="Password">
<button id="submit" class="btn btn-dark">Masuk</button>
<button id="toggle" class="btn btn-light">Buat akun</button>
<a href="index.html" style="text-align:center;color:#888;font-size:13px">Kembali</a>
</div><p id="msg" class="muted"></p></div></div>
<script>
let register=new URLSearchParams(location.search).get("mode")==="register";
const title=document.getElementById("title"),sub=document.getElementById("sub"),submit=document.getElementById("submit"),toggle=document.getElementById("toggle"),msg=document.getElementById("msg");
function render(){title.textContent=register?"Buat Vault baru":"Selamat datang kembali";sub.textContent=register?"Daftarkan akun untuk menyimpan foto secara private.":"Masuk ke brankas foto pribadi kamu.";submit.textContent=register?"Daftar":"Masuk";toggle.textContent=register?"Saya sudah punya akun":"Buat akun"}
toggle.onclick=()=>{register=!register;render()};render();
submit.onclick=async()=>{
msg.textContent="Memproses...";
const email=document.getElementById("email").value.trim(),password=document.getElementById("password").value;
if(!email||password.length<6){msg.textContent="Masukkan email dan password minimal 6 karakter.";return}
let r=register?await FV.db.auth.signUp({email,password}):await FV.db.auth.signInWithPassword({email,password});
if(r.error){msg.textContent=r.error.message;return}
if(register&&!r.data.session){msg.textContent="Akun dibuat. Jika email confirmation aktif, cek email kamu.";return}
location.href="dashboard.html";
};
</script></body></html>
