<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login — FotoVault</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="app.js"></script>
</head>

<body>

<div class="auth">

  <div class="authbox glass">

    <a href="index.html" class="brand">
      Foto<span class="gold">Vault</span>
    </a>

    <div style="margin-top:24px">

      <span class="pill" id="modeBadge">
        PRIVATE PHOTO VAULT
      </span>

      <h1 class="serif" id="title">
        Selamat datang kembali
      </h1>

      <p class="muted" id="sub">
        Masuk ke brankas foto pribadi kamu.
      </p>

    </div>

    <div class="stack" style="margin-top:24px">

      <div>
        <label class="muted"
               style="display:block;margin-bottom:7px">
          Email
        </label>

        <input
          id="email"
          class="input"
          type="email"
          autocomplete="email"
          placeholder="nama@email.com"
        >
      </div>

      <div>
        <label class="muted"
               style="display:block;margin-bottom:7px">
          Password
        </label>

        <input
          id="password"
          class="input"
          type="password"
          autocomplete="current-password"
          placeholder="Password"
        >
      </div>

      <button
        id="submit"
        class="btn btn-dark"
        type="button"
      >
        Masuk
      </button>

      <button
        id="toggle"
        class="btn btn-light"
        type="button"
      >
        Buat akun
      </button>

      <a
        href="index.html"
        style="
          text-align:center;
          color:#888;
          font-size:13px;
          text-decoration:none;
          margin-top:4px;
        "
      >
        Kembali ke halaman utama
      </a>

    </div>

    <div
      id="loading"
      class="hidden"
      style="
        text-align:center;
        margin-top:20px;
      "
    >
      <span class="pill">
        Memproses...
      </span>
    </div>

    <p
      id="msg"
      class="muted"
      style="
        margin-top:18px;
        line-height:1.6;
      "
    ></p>

  </div>

</div>


<script>

/* =========================================================
   FOTO VAULT LOGIN
   ========================================================= */

let registerMode = false;


/* ---------------------------------------------------------
   ELEMENT
   --------------------------------------------------------- */

const emailInput =
  document.getElementById("email");

const passwordInput =
  document.getElementById("password");

const submitButton =
  document.getElementById("submit");

const toggleButton =
  document.getElementById("toggle");

const titleElement =
  document.getElementById("title");

const subElement =
  document.getElementById("sub");

const modeBadge =
  document.getElementById("modeBadge");

const messageElement =
  document.getElementById("msg");

const loadingElement =
  document.getElementById("loading");


/* ---------------------------------------------------------
   MESSAGE
   --------------------------------------------------------- */

function showMessage(message, error = false) {

  messageElement.textContent = message;

  if (error) {
    messageElement.style.color = "#b42318";
  } else {
    messageElement.style.color = "#777";
  }

}


/* ---------------------------------------------------------
   LOADING
   --------------------------------------------------------- */

function setLoading(state) {

  if (state) {

    loadingElement.classList.remove("hidden");

    submitButton.disabled = true;
    toggleButton.disabled = true;

    submitButton.style.opacity = "0.6";
    toggleButton.style.opacity = "0.6";

  } else {

    loadingElement.classList.add("hidden");

    submitButton.disabled = false;
    toggleButton.disabled = false;

    submitButton.style.opacity = "1";
    toggleButton.style.opacity = "1";

  }

}


/* ---------------------------------------------------------
   MODE
   --------------------------------------------------------- */

function renderMode() {

  showMessage("");

  if (registerMode) {

    modeBadge.textContent =
      "CREATE YOUR VAULT";

    titleElement.textContent =
      "Buat Vault baru";

    subElement.textContent =
      "Daftarkan akun untuk menyimpan foto secara private.";

    submitButton.textContent =
      "Daftar";

    toggleButton.textContent =
      "Saya sudah punya akun";

    passwordInput.autocomplete =
      "new-password";

  } else {

    modeBadge.textContent =
      "PRIVATE PHOTO VAULT";

    titleElement.textContent =
      "Selamat datang kembali";

    subElement.textContent =
      "Masuk ke brankas foto pribadi kamu.";

    submitButton.textContent =
      "Masuk";

    toggleButton.textContent =
      "Buat akun";

    passwordInput.autocomplete =
      "current-password";

  }

}


/* ---------------------------------------------------------
   TOGGLE LOGIN / REGISTER
   --------------------------------------------------------- */

toggleButton.addEventListener(
  "click",
  function () {

    registerMode = !registerMode;

    renderMode();

  }
);


/* ---------------------------------------------------------
   CHECK ADMIN ROLE
   ---------------------------------------------------------

   Bagian penting:

   user_roles
   user_id
   role = admin

   Jika admin:
       admin.html

   Jika user:
       dashboard.html
   --------------------------------------------------------- */

async function redirectAfterLogin(user) {

  try {

    /*
     * Ambil role dari tabel user_roles.
     */

    const { data, error } =
      await FV.db
        .from("user_roles")
        .select("role")
        .eq("user_id", user.id)
        .maybeSingle();


    /*
     * Kalau query role error, jangan langsung
     * menganggap user sebagai admin.
     */

    if (error) {

      console.error(
        "Role check error:",
        error
      );

      showMessage(
        "Login berhasil, tetapi role akun belum dapat diperiksa.",
        true
      );

      setTimeout(
        () => {
          location.href =
            "dashboard.html";
        },
        1200
      );

      return;
    }


    /*
     * ADMIN
     */

    if (
      data &&
      String(data.role).toLowerCase() === "admin"
    ) {

      showMessage(
        "Login berhasil. Membuka Admin Dashboard..."
      );

      setTimeout(
        () => {
          location.href =
            "admin.html";
        },
        300
      );

      return;
    }


    /*
     * USER BIASA
     */

    showMessage(
      "Login berhasil. Membuka dashboard..."
    );

    setTimeout(
      () => {
        location.href =
          "dashboard.html";
      },
      300
    );

  } catch (err) {

    console.error(
      "Redirect error:",
      err
    );

    /*
     * Fallback aman:
     * kalau pengecekan role gagal,
     * jangan memberikan akses admin.
     */

    location.href =
      "dashboard.html";

  }

}


/* ---------------------------------------------------------
   LOGIN
   --------------------------------------------------------- */

async function loginUser() {

  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;


  /*
   * Validasi
   */

  if (!email) {

    showMessage(
      "Masukkan alamat email.",
      true
    );

    emailInput.focus();

    return;
  }


  if (!password) {

    showMessage(
      "Masukkan password.",
      true
    );

    passwordInput.focus();

    return;
  }


  if (password.length < 6) {

    showMessage(
      "Password minimal 6 karakter.",
      true
    );

    passwordInput.focus();

    return;
  }


  setLoading(true);

  showMessage(
    "Memverifikasi akun..."
  );


  try {

    /*
     * Login Supabase
     */

    const {
      data,
      error
    } =
      await FV.db.auth.signInWithPassword({
        email: email,
        password: password
      });


    /*
     * Login gagal
     */

    if (error) {

      console.error(
        "Supabase login:",
        error
      );

      showMessage(
        error.message ||
        "Email atau password salah.",
        true
      );

      setLoading(false);

      return;
    }


    /*
     * Tidak ada session
     */

    if (
      !data ||
      !data.session ||
      !data.user
    ) {

      showMessage(
        "Session login tidak ditemukan.",
        true
      );

      setLoading(false);

      return;
    }


    /*
     * LOGIN BERHASIL
     *
     * Sekarang cek role.
     */

    await redirectAfterLogin(
      data.user
    );


  } catch (error) {

    console.error(
      error
    );

    showMessage(
      "Terjadi kesalahan saat login.",
      true
    );

    setLoading(false);

  }

}


/* ---------------------------------------------------------
   REGISTER
   --------------------------------------------------------- */

async function registerUser() {

  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;


  /*
   * Validasi
   */

  if (!email) {

    showMessage(
      "Masukkan alamat email.",
      true
    );

    emailInput.focus();

    return;
  }


  if (!password) {

    showMessage(
      "Masukkan password.",
      true
    );

    passwordInput.focus();

    return;
  }


  if (password.length < 6) {

    showMessage(
      "Password minimal 6 karakter.",
      true
    );

    passwordInput.focus();

    return;
  }


  setLoading(true);

  showMessage(
    "Membuat akun..."
  );


  try {

    /*
     * Register Supabase
     */

    const {
      data,
      error
    } =
      await FV.db.auth.signUp({
        email: email,
        password: password
      });


    /*
     * Register gagal
     */

    if (error) {

      console.error(
        "Supabase register:",
        error
      );

      showMessage(
        error.message ||
        "Gagal membuat akun.",
        true
      );

      setLoading(false);

      return;
    }


    /*
     * Jika email confirmation aktif
     */

    if (
      !data.session
    ) {

      showMessage(
        "Akun berhasil dibuat. Silakan cek email untuk konfirmasi."
      );

      setLoading(false);

      return;
    }


    /*
     * Kalau confirmation tidak aktif,
     * user langsung login.
     *
     * Akun baru otomatis dianggap USER,
     * bukan ADMIN.
     */

    await redirectAfterLogin(
      data.user
    );

  } catch (error) {

    console.error(
      error
    );

    showMessage(
      "Terjadi kesalahan saat membuat akun.",
      true
    );

    setLoading(false);

  }

}


/* ---------------------------------------------------------
   SUBMIT
   --------------------------------------------------------- */

submitButton.addEventListener(
  "click",
  async function () {

    if (registerMode) {

      await registerUser();

    } else {

      await loginUser();

    }

  }
);


/* ---------------------------------------------------------
   ENTER KEY
   --------------------------------------------------------- */

[emailInput, passwordInput].forEach(
  input => {

    input.addEventListener(
      "keydown",
      function (event) {

        if (
          event.key === "Enter"
        ) {

          submitButton.click();

        }

      }
    );

  }
);


/* ---------------------------------------------------------
   INITIAL MODE
   --------------------------------------------------------- */

const params =
  new URLSearchParams(
    window.location.search
  );

if (
  params.get("mode") ===
  "register"
) {

  registerMode = true;

}

renderMode();


/* ---------------------------------------------------------
   CEK SESSION SAAT HALAMAN DIBUKA
   ---------------------------------------------------------

   Kalau user sudah login sebelumnya,
   jangan menampilkan halaman login lagi.
   --------------------------------------------------------- */

(async function checkExistingSession() {

  try {

    const {
      data
    } =
      await FV.db.auth.getSession();


    if (
      data &&
      data.session &&
      data.session.user
    ) {

      /*
       * Sudah login.
       * Periksa role lalu arahkan.
       */

      await redirectAfterLogin(
        data.session.user
      );

    }

  } catch (error) {

    console.error(
      "Session check:",
      error
    );

  }

})();

</script>

</body>
</html>
