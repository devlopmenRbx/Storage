<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FotoVault</title><link rel="stylesheet" href="style.css"></head><body>
<div id="toast" class="toast"></div>
<section id="authView" class="auth"><div class="card"><div class="logo">FV</div><h1>FotoVault</h1><p>Simpan dan kelola foto pribadi Anda dengan aman.</p><form id="authForm"><label>Email</label><input id="email" type="email" placeholder="admin@fotovault.local" required><label>Password</label><input id="password" type="password" required><button id="authSubmit">Masuk</button></form><small>FotoVault v1.0 • GitHub Pages</small></div></section>
<section id="appView" class="hidden"><header><b>FotoVault</b><span id="userEmail"></span><button id="logoutBtn">Keluar</button></header><main><nav><button class="nav-item active" data-section="photos">🖼️ Foto</button><button class="nav-item" data-section="albums">📁 Album</button><div id="storageText">0 KB / 1 GB</div><div class="bar"><i id="storageBar"></i></div></nav><article><div class="head"><div><h2 id="pageTitle">Foto Saya</h2><p id="pageSubtitle">Semua foto Anda dalam satu tempat.</p></div><label class="upload">+ Upload Foto<input id="fileInput" type="file" accept="image/*" multiple hidden></label></div><div id="photosSection"><div id="dropZone" class="drop">Tarik foto ke sini atau gunakan Upload Foto</div><input id="searchInput" placeholder="Cari foto..."><div id="progressArea" class="hidden"></div><div id="photoGrid" class="grid"></div><div id="emptyState" class="empty"><h3>Belum ada foto</h3></div></div><div id="albumsSection" class="hidden"><button id="newAlbumBtn">+ Album Baru</button><div id="albumGrid" class="grid"></div></div></article></main></section>
<div id="viewer" class="modal hidden"><div class="modalbox"><button data-close="viewer">×</button><img id="viewerImage"><h3 id="viewerName"></h3><p id="viewerMeta"></p><button id="downloadBtn">Download</button> <button id="deleteBtn">Hapus</button></div></div>
<div id="albumModal" class="modal hidden"><div class="modalbox"><button data-close="albumModal">×</button><h3>Album Baru</h3><input id="albumName" placeholder="Nama album"><button id="createAlbumBtn">Buat Album</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js?v=1.0.1"></script></body></html>
