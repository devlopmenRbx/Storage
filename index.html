<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050608">
<meta name="description" content="FotoVault — Premium personal photo storage">

<title>FotoVault</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        sans-serif;

    color:#f5f5f7;

    background:
        radial-gradient(
            circle at 15% 15%,
            rgba(86,100,255,.16),
            transparent 28%
        ),
        radial-gradient(
            circle at 85% 20%,
            rgba(0,210,255,.10),
            transparent 28%
        ),
        radial-gradient(
            circle at 50% 100%,
            rgba(100,80,255,.12),
            transparent 35%
        ),
        #050608;

    overflow-x:hidden;
}


/* =========================================================
   BACKGROUND EFFECT
========================================================= */

body::before{
    content:"";
    position:fixed;
    inset:-30%;
    pointer-events:none;

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.035) 1px,
            transparent 1px
        );

    background-size:35px 35px;

    opacity:.35;

    animation:
        backgroundMove 30s linear infinite;

    z-index:-2;
}

body::after{
    content:"";
    position:fixed;

    width:500px;
    height:500px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(89,95,255,.12),
            transparent 65%
        );

    filter:blur(20px);

    left:-150px;
    top:20%;

    animation:
        orbMove 12s ease-in-out infinite alternate;

    pointer-events:none;

    z-index:-1;
}

@keyframes backgroundMove{

    from{
        transform:translate3d(0,0,0);
    }

    to{
        transform:translate3d(35px,35px,0);
    }
}

@keyframes orbMove{

    from{
        transform:translate3d(0,0,0) scale(1);
    }

    to{
        transform:translate3d(220px,-80px,0) scale(1.2);
    }
}


/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-track{
    background:#050608;
}

::-webkit-scrollbar-thumb{
    background:#292b32;
    border-radius:20px;
}

::-webkit-scrollbar-thumb:hover{
    background:#454852;
}


/* =========================================================
   COMMON
========================================================= */

.hidden{
    display:none !important;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

button:active{
    transform:scale(.97);
}

input{
    outline:none;
}


/* =========================================================
   LOGIN
========================================================= */

.auth{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:30px;

    position:relative;
}

.auth::before{
    content:"";

    position:absolute;

    width:650px;
    height:650px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(95,100,255,.16),
            transparent 65%
        );

    filter:blur(30px);

    animation:
        authGlow 8s ease-in-out infinite alternate;
}

@keyframes authGlow{

    from{
        transform:translate(-100px,-30px) scale(1);
    }

    to{
        transform:translate(100px,40px) scale(1.18);
    }
}


.card{
    width:min(470px,100%);

    padding:42px;

    position:relative;

    z-index:2;

    border:1px solid rgba(255,255,255,.10);

    border-radius:34px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.10),
            rgba(255,255,255,.035)
        );

    backdrop-filter:
        blur(35px)
        saturate(150%);

    -webkit-backdrop-filter:
        blur(35px)
        saturate(150%);

    box-shadow:
        0 40px 100px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.08);

    animation:
        cardEntrance .8s cubic-bezier(.2,.8,.2,1);
}

@keyframes cardEntrance{

    from{
        opacity:0;
        transform:
            translateY(30px)
            scale(.96);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}


.logo{
    width:64px;
    height:64px;

    border-radius:20px;

    display:grid;
    place-items:center;

    font-size:18px;
    font-weight:800;
    letter-spacing:-.5px;

    color:white;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #aeb4ff
        );

    color:#090a0d;

    box-shadow:
        0 15px 35px rgba(130,135,255,.25);

    animation:
        logoFloat 5s ease-in-out infinite;
}

@keyframes logoFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-5px);
    }
}


.card h1{
    margin-top:30px;

    font-size:42px;
    line-height:1;

    letter-spacing:-2px;

    background:
        linear-gradient(
            100deg,
            #ffffff,
            #aeb4ff
        );

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;
}

.card p{
    margin-top:14px;

    color:#92959e;

    font-size:15px;

    line-height:1.7;
}


.card label{
    display:block;

    margin-top:25px;
    margin-bottom:9px;

    color:#c8cad0;

    font-size:13px;
    font-weight:600;
}


.card input{
    width:100%;

    padding:15px 16px;

    color:white;

    background:
        rgba(255,255,255,.055);

    border:
        1px solid rgba(255,255,255,.09);

    border-radius:15px;

    transition:
        .25s ease;
}

.card input::placeholder{
    color:#666a73;
}

.card input:focus{
    border-color:
        rgba(160,165,255,.65);

    background:
        rgba(255,255,255,.075);

    box-shadow:
        0 0 0 4px
        rgba(105,110,255,.10);
}


.card button{
    width:100%;

    margin-top:24px;

    padding:15px;

    border:0;

    border-radius:15px;

    color:#08090b;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #b9bdff
        );

    font-weight:700;

    box-shadow:
        0 12px 30px
        rgba(130,135,255,.18);

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}

.card button:hover{
    transform:
        translateY(-2px);

    box-shadow:
        0 18px 40px
        rgba(130,135,255,.28);
}

.card small{
    display:block;

    margin-top:22px;

    text-align:center;

    color:#575b64;

    font-size:11px;
}


/* =========================================================
   HEADER
========================================================= */

header{
    height:78px;

    position:sticky;
    top:0;

    z-index:30;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:
        0 28px;

    border-bottom:
        1px solid
        rgba(255,255,255,.07);

    background:
        rgba(5,6,8,.68);

    backdrop-filter:
        blur(25px)
        saturate(160%);

    -webkit-backdrop-filter:
        blur(25px)
        saturate(160%);
}


header b{
    font-size:18px;

    letter-spacing:-.5px;
}


header span{
    margin-left:auto;
    margin-right:18px;

    color:#858891;

    font-size:13px;
}


header button{
    border:
        1px solid
        rgba(255,255,255,.10);

    border-radius:12px;

    padding:
        9px 14px;

    background:
        rgba(255,255,255,.045);

    color:#dfe1e6;

    transition:
        .25s ease;
}

header button:hover{
    background:
        rgba(255,255,255,.09);

    border-color:
        rgba(255,255,255,.18);
}


/* =========================================================
   MAIN LAYOUT
========================================================= */

main{
    min-height:
        calc(100vh - 78px);

    display:flex;
}


/* =========================================================
   SIDEBAR
========================================================= */

nav{
    width:245px;

    padding:24px 18px;

    border-right:
        1px solid
        rgba(255,255,255,.07);

    background:
        rgba(7,8,11,.62);

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);

    flex-shrink:0;
}


.nav-item{
    width:100%;

    border:0;

    background:transparent;

    color:#777b84;

    text-align:left;

    padding:13px 15px;

    margin-bottom:6px;

    border-radius:13px;

    font-size:14px;

    transition:
        .25s ease;
}

.nav-item:hover{
    color:#e7e8eb;

    background:
        rgba(255,255,255,.045);
}

.nav-item.active{
    color:#fff;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,.11),
            rgba(255,255,255,.045)
        );

    border:
        1px solid
        rgba(255,255,255,.07);

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,.05);
}


/* =========================================================
   STORAGE
========================================================= */

nav > div{
    margin-top:35px;

    padding:17px;

    border-radius:17px;

    border:
        1px solid
        rgba(255,255,255,.07);

    background:
        rgba(255,255,255,.035);

    color:#8e929a;

    font-size:12px;
}


.bar{
    height:6px;

    margin-top:12px;

    overflow:hidden;

    border-radius:10px;

    background:
        rgba(255,255,255,.08);
}


.bar i{
    display:block;

    width:0;
    height:100%;

    border-radius:10px;

    background:
        linear-gradient(
            90deg,
            #777cff,
            #b7bbff
        );

    box-shadow:
        0 0 15px
        rgba(120,125,255,.45);

    transition:
        width 1s cubic-bezier(.2,.8,.2,1);
}


/* =========================================================
   CONTENT
========================================================= */

article{
    width:100%;

    max-width:1400px;

    margin:auto;

    padding:42px;
}


.head{
    display:flex;

    align-items:flex-end;

    justify-content:space-between;

    gap:25px;

    margin-bottom:30px;
}


#pageTitle{
    font-size:38px;

    letter-spacing:-1.8px;

    line-height:1;
}


#pageSubtitle{
    margin-top:9px;

    color:#777b84;

    font-size:14px;
}


/* =========================================================
   UPLOAD
========================================================= */

.upload{
    position:relative;

    display:inline-flex;

    align-items:center;

    justify-content:center;

    padding:
        13px 19px;

    border-radius:14px;

    color:#08090b;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #babdff
        );

    font-size:13px;
    font-weight:700;

    cursor:pointer;

    box-shadow:
        0 12px 30px
        rgba(120,125,255,.15);

    transition:
        .25s ease;
}

.upload:hover{
    transform:
        translateY(-2px);

    box-shadow:
        0 18px 40px
        rgba(120,125,255,.25);
}


/* =========================================================
   DROP AREA
========================================================= */

.drop{
    position:relative;

    border:
        1px dashed
        rgba(255,255,255,.13);

    border-radius:20px;

    padding:35px;

    text-align:center;

    color:#737781;

    background:
        rgba(255,255,255,.025);

    transition:
        .3s ease;

    overflow:hidden;
}

.drop::before{
    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            110deg,
            transparent,
            rgba(255,255,255,.05),
            transparent
        );

    transform:
        translateX(-100%);

    transition:
        .6s ease;
}

.drop:hover::before{
    transform:
        translateX(100%);
}

.drop:hover{
    border-color:
        rgba(180,185,255,.35);

    background:
        rgba(255,255,255,.04);
}


/* =========================================================
   SEARCH
========================================================= */

#searchInput{
    width:100%;

    max-width:400px;

    padding:14px 17px;

    margin:
        20px 0;

    color:white;

    border:
        1px solid
        rgba(255,255,255,.08);

    border-radius:14px;

    background:
        rgba(255,255,255,.045);

    transition:
        .25s ease;
}

#searchInput::placeholder{
    color:#5f636c;
}

#searchInput:focus{
    border-color:
        rgba(160,165,255,.45);

    box-shadow:
        0 0 0 4px
        rgba(110,115,255,.08);
}


/* =========================================================
   PHOTO GRID
========================================================= */

.grid{
    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(190px,1fr)
        );

    gap:17px;

    margin-top:15px;
}


.photo-card{
    position:relative;

    height:225px;

    overflow:hidden;

    padding:0;

    border:0;

    border-radius:20px;

    background:#111;

    isolation:isolate;

    transform:
        translateZ(0);

    box-shadow:
        0 12px 30px
        rgba(0,0,0,.22);

    transition:
        transform .4s cubic-bezier(.2,.8,.2,1),
        box-shadow .4s ease;
}

.photo-card::after{
    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            180deg,
            transparent 45%,
            rgba(0,0,0,.62)
        );

    opacity:.65;

    z-index:1;
}

.photo-card img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;

    transition:
        transform .7s
        cubic-bezier(.2,.8,.2,1),
        filter .5s ease;
}


.photo-card:hover{
    transform:
        translateY(-7px)
        scale(1.015);

    box-shadow:
        0 25px 55px
        rgba(0,0,0,.42);
}

.photo-card:hover img{
    transform:
        scale(1.08);

    filter:
        brightness(1.05);
}


/* =========================================================
   EMPTY
========================================================= */

.empty{
    padding:90px 20px;

    text-align:center;

    color:#676b74;
}

.empty h3{
    color:#d4d6db;

    font-size:17px;
}


/* =========================================================
   MODAL
========================================================= */

.modal{
    position:fixed;

    inset:0;

    z-index:100;

    display:grid;

    place-items:center;

    padding:25px;

    background:
        rgba(0,0,0,.72);

    backdrop-filter:
        blur(20px);

    -webkit-backdrop-filter:
        blur(20px);

    animation:
        modalBackground .3s ease;
}

@keyframes modalBackground{

    from{
        opacity:0;
    }

    to{
        opacity:1;
    }
}


.modalbox{
    position:relative;

    width:min(900px,100%);

    padding:16px;

    border:
        1px solid
        rgba(255,255,255,.10);

    border-radius:25px;

    background:
        rgba(17,18,22,.88);

    box-shadow:
        0 40px 100px
        rgba(0,0,0,.65);

    animation:
        modalCard .4s
        cubic-bezier(.2,.8,.2,1);
}

@keyframes modalCard{

    from{
        opacity:0;
        transform:
            translateY(25px)
            scale(.96);
    }

    to{
        opacity:1;
        transform:
            translateY(0)
            scale(1);
    }
}


.modalbox > button:first-child{
    position:absolute;

    top:13px;
    right:13px;

    z-index:5;

    width:38px;
    height:38px;

    border:0;

    border-radius:50%;

    color:white;

    background:
        rgba(0,0,0,.55);

    backdrop-filter:
        blur(10px);

    font-size:20px;
}


#viewerImage{
    width:100%;

    max-height:70vh;

    display:block;

    object-fit:contain;

    border-radius:17px;

    background:#050608;
}


#viewerName{
    margin:17px 3px 5px;

    color:white;

    font-size:17px;
}


#viewerMeta{
    margin-left:3px;

    color:#777b84;

    font-size:12px;
}


#downloadBtn,
#deleteBtn,
#newAlbumBtn,
#createAlbumBtn{
    border:0;

    border-radius:12px;

    padding:12px 17px;

    font-weight:600;

    transition:
        .25s ease;
}


#downloadBtn,
#newAlbumBtn,
#createAlbumBtn{
    color:#090a0d;

    background:
        linear-gradient(
            135deg,
            #fff,
            #babdff
        );
}


#deleteBtn{
    color:white;

    background:
        rgba(255,70,80,.14);

    border:
        1px solid
        rgba(255,70,80,.25);
}

#downloadBtn:hover,
#deleteBtn:hover,
#newAlbumBtn:hover,
#createAlbumBtn:hover{
    transform:
        translateY(-2px);
}


/* =========================================================
   ALBUM
========================================================= */

.album-card{
    padding:23px;

    border-radius:19px;

    border:
        1px solid
        rgba(255,255,255,.07);

    background:
        rgba(255,255,255,.035);

    transition:
        .3s ease;
}

.album-card:hover{
    transform:
        translateY(-5px);

    border-color:
        rgba(255,255,255,.14);

    background:
        rgba(255,255,255,.055);

    box-shadow:
        0 20px 45px
        rgba(0,0,0,.25);
}


/* =========================================================
   PROGRESS
========================================================= */

#progressArea{
    margin:15px 0;
}

.progress-row{
    padding:14px;

    margin-bottom:8px;

    border:
        1px solid
        rgba(255,255,255,.07);

    border-radius:14px;

    background:
        rgba(255,255,255,.035);

    color:#bfc1c7;
}

.progress-row .small{
    margin:6px 0;

    color:#777b84;

    font-size:12px;
}

.line{
    height:5px;

    overflow:hidden;

    border-radius:10px;

    background:
        rgba(255,255,255,.08);
}

.line i{
    display:block;

    width:0;
    height:100%;

    border-radius:10px;

    background:
        linear-gradient(
            90deg,
            #777cff,
            #c0c3ff
        );

    transition:
        width .5s ease;
}


/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;

    left:50%;
    bottom:28px;

    z-index:200;

    transform:
        translate(-50%,20px);

    padding:
        13px 18px;

    border:
        1px solid
        rgba(255,255,255,.10);

    border-radius:14px;

    color:white;

    background:
        rgba(25,26,30,.85);

    backdrop-filter:
        blur(20px);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.35);

    font-size:13px;

    opacity:0;

    pointer-events:none;

    transition:
        .3s ease;
}

.toast.show{
    opacity:1;

    transform:
        translate(-50%,0);
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px){

    header{
        padding:
            0 17px;
    }

    header span{
        display:none;
    }

    main{
        display:block;
    }

    nav{
        width:100%;

        display:flex;

        gap:6px;

        overflow-x:auto;

        padding:
            12px;

        border-right:0;

        border-bottom:
            1px solid
            rgba(255,255,255,.07);
    }

    .nav-item{
        min-width:120px;

        margin:0;
    }

    nav > div{
        display:none;
    }

    article{
        padding:
            27px 18px;
    }

    .head{
        display:block;
    }

    #pageTitle{
        font-size:31px;
    }

    .upload{
        margin-top:20px;
    }

    .grid{
        grid-template-columns:
            repeat(2,1fr);

        gap:10px;
    }

    .photo-card{
        height:175px;

        border-radius:15px;
    }

    .auth{
        padding:18px;
    }

    .card{
        padding:30px 23px;

        border-radius:27px;
    }

    .card h1{
        font-size:36px;
    }
}


@media(max-width:420px){

    .grid{
        grid-template-columns:
            repeat(2,1fr);
    }

    .photo-card{
        height:155px;
    }

    article{
        padding:
            22px 14px;
    }
}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
    }
}

</style>
</head>

<body>


<!-- =====================================================
     LOGIN
===================================================== -->

<section id="authView" class="auth">

    <div class="card">

        <div class="logo">
            FV
        </div>

        <h1>
            FotoVault
        </h1>

        <p>
            Simpan dan kelola foto pribadi Anda
            dalam satu ruang yang elegan,
            cepat, dan aman.
        </p>


        <form id="authForm">

            <label>
                Email
            </label>

            <input
                id="email"
                type="email"
                autocomplete="email"
                placeholder="Masukkan email"
                required
            >


            <label>
                Password
            </label>

            <input
                id="password"
                type="password"
                autocomplete="current-password"
                placeholder="Masukkan password"
                required
            >


            <button
                id="authSubmit"
                type="submit"
            >
                Masuk
            </button>

        </form>


        <small>
            FotoVault v1.0
        </small>

    </div>

</section>



<!-- =====================================================
     APPLICATION
===================================================== -->

<section
    id="appView"
    class="hidden"
>


<header>

    <b>
        FotoVault
    </b>


    <span id="userEmail">
        User
    </span>


    <button
        id="logoutBtn"
        type="button"
    >
        Keluar
    </button>

</header>



<main>


<!-- SIDEBAR -->

<nav>

    <button
        class="nav-item active"
        data-section="photos"
        type="button"
    >
        Foto Saya
    </button>
