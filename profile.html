<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile — FotoVault</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></head><body><header class="nav glass"><div class="row"><a class="brand" href="dashboard.html">Foto<span class="gold">Vault</span></a><button class="btn btn-light" onclick="FV.signOut()">Keluar</button></div></header><main class="wrap" style="padding:50px 0 80px"><section class="authbox glass" style="margin:auto;text-align:center"><span class="pill">YOUR IDENTITY</span><h1 class="serif">Profile</h1><div id="avatarWrap" style="display:grid;place-items:center;margin:22px 0"></div><input id="avatar" type="file" accept="image/*" hidden><button class="btn btn-light" id="avatarBtn">Ganti foto profil</button><div class="stack" style="margin-top:25px;text-align:left"><label class="muted">Nama</label><input id="name" class="input" placeholder="Nama kamu"><label class="muted">Email</label><input id="email" class="input" disabled><label class="muted">User ID</label><input id="uid" class="input" disabled><button class="btn btn-dark" id="save">Simpan profil</button><a class="btn btn-light" href="dashboard.html" style="text-align:center">Kembali</a></div><p id="msg" class="muted"></p></section></main><script>let s,u,profile;const $=id=>document.getElementById(id);function msg(x){$('msg').textContent=x}async function load(){const r=await FV.db.from('profiles').select('*').eq('user_id',u.id).maybeSingle();profile=r.data||{};$('name').value=profile.display_name||'';$('email').value=u.email||'';$('uid').value=u.id;const w=$('avatarWrap');w.innerHTML=profile.avatar_path?`<img class="profile-avatar" src="${(await FV.db.storage.from('avatars').createSignedUrl(profile.avatar_path,900)).data?.signedUrl||''}">`:`<div class="avatar-placeholder">${FV.escapeHtml((profile.display_name||u.email||'U').slice(0,1).toUpperCase())}</div>`}$('avatarBtn').onclick=()=>$('avatar').click();$('avatar').onchange=async e=>{const f=e.target.files[0];if(!f)return;msg('Upload foto profil...');const path=`${u.id}/${crypto.randomUUID()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;const up=await FV.db.storage.from('avatars').upload(path,f,{contentType:f.type,upsert:false});if(up.error)return msg(up.error.message);const r=await FV.db.from('profiles').upsert({user_id:u.id,display_name:$('name').value.trim(),avatar_path:path,updated_at:new Date().toISOString()});if(r.error)msg(r.error.message);else{msg('Foto profil diperbarui.');load()}};$('save').onclick=async()=>{const r=await FV.db.from('profiles').upsert({user_id:u.id,display_name:$('name').value.trim(),updated_at:new Date().toISOString()});msg(r.error?r.error.message:'Profil tersimpan.');load()};(async()=>{s=await FV.requireSession();u=s.user;const {data:role}=await FV.db.from('user_roles').select('role').eq('user_id',u.id).maybeSingle();if(String(role?.role||'').toLowerCase()==='admin')return location.replace('admin.html');await load()})()</script></body></html>
