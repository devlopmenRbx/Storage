<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile — FotoVault</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script></head><body>
<header class="nav glass"><div class="row"><a class="brand" href="dashboard.html">Foto<span class="gold">Vault</span></a><button class="btn btn-light" onclick="FV.signOut()">Keluar</button></div></header>
<main class="wrap" style="padding:50px 0"><section class="authbox glass" style="margin:auto"><span class="pill">Account</span><h1 class="serif">Profile</h1><div class="stack"><label class="muted">Email</label><input id="email" class="input" disabled><label class="muted">User ID</label><input id="uid" class="input" disabled><label class="muted">Terdaftar</label><input id="created" class="input" disabled><a class="btn btn-dark" href="dashboard.html" style="text-align:center">Kembali ke dashboard</a></div></section></main>
<script>(async()=>{const s=await FV.requireSession();document.getElementById("email").value=s.user.email||"";document.getElementById("uid").value=s.user.id;document.getElementById("created").value=new Date(s.user.created_at).toLocaleString("id-ID")})()</script></body></html>
